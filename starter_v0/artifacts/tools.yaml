# Tool declarations used by the model. Names must match tools/__init__.py.
tools:
  - name: wiki
    description: "Tra Wikipedia để tìm định nghĩa, tiểu sử hoặc kiến thức nền ổn định. Dùng khi người dùng hỏi 'X là gì/ai' hoặc nêu rõ Wikipedia; không dùng cho tin tức mới, tweet, paper hay tìm repo."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Chủ đề hoặc tên cần tra."}
        lang: {type: string, enum: [vi, en], default: "vi", description: "Ngôn ngữ Wikipedia: vi hoặc en."}
        limit: {type: integer, default: 5, description: "Số bài, từ 1 đến 10."}
      required: [query]

  - name: hn_search
    description: "Tìm thảo luận hoặc bài đăng trên Hacker News theo chủ đề. Dùng khi người dùng nhắc Hacker News/HN hoặc cộng đồng lập trình; không dùng cho tweet, tin web nói chung hay repository GitHub."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Chủ đề ngắn gọn cần tìm."}
        sort: {type: string, enum: [relevance, date], default: "relevance", description: "date=mới nhất; relevance=liên quan nhất."}
        limit: {type: integer, default: 5, description: "Số kết quả, từ 1 đến 20."}
      required: [query]

  - name: github_repos
    description: "Tìm repository mã nguồn mở trên GitHub. Dùng khi người dùng muốn repo/dự án/thư viện trên GitHub; không dùng để trả lời câu hỏi lập trình, đọc URL bài báo hoặc tìm tin tức."
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khóa dự án, bỏ cụm từ GitHub hoặc repository chung chung."}
        language: {type: string, default: "", description: "Ngôn ngữ lập trình nếu người dùng chỉ rõ, ví dụ Python hoặc Rust."}
        sort: {type: string, enum: [best_match, stars, updated], default: "best_match", description: "stars=nhiều sao; updated=mới cập nhật; best_match=liên quan nhất."}
        limit: {type: integer, default: 5, description: "Số repo, từ 1 đến 20."}
      required: [query]

  - name: dedupe_sources
    description: "Gộp các nguồn nghiên cứu trùng URL trong danh sách item đã có. Dùng khi user yêu cầu loại nguồn trùng trước khi tổng hợp; không dùng để tìm hoặc tải nguồn mới. Giữ item đầu tiên và bỏ tham số theo dõi URL."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Các nguồn đã có, mỗi item nên có url và có thể có title/summary."
          items:
            type: object
            properties:
              url: {type: string, description: "URL tuyệt đối của nguồn"}
              title: {type: string, description: "Tiêu đề nguồn"}
              summary: {type: string, description: "Tóm tắt nếu có"}
      required: [items]

  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi người dùng một thông tin còn thiếu hoặc xin xác nhận. Dùng khi thiếu handle/URL cần thiết (response_type=text) hoặc trước mọi yêu cầu gửi/đăng (response_type=yes_no); không tự đoán dữ liệu còn thiếu. Không dùng khi đã đủ thông tin để nghiên cứu."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây của MỘT tài khoản X/Twitter. Dùng khi user hỏi bài của một người hoặc một handle cụ thể; Sam Altman=sama, Elon Musk=elonmusk. Không dùng cho tìm theo chủ đề hoặc tin web."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Handle tài khoản không có @. Tên Sam Altman → sama; Elon Musk → elonmusk. Hỏi lại nếu không xác định được tài khoản."}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng X/Twitter theo CHỦ ĐỀ khi user yêu cầu tweet, X hoặc Twitter. Không dùng cho tin tức trên web, kể cả khi hội thoại trước đó từng nói về Twitter nhưng lượt mới chuyển sang web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tìm trên WEB. Dùng cho tin tức, bài báo, thông tin chung; đặt topic=news và timeframe=day khi hỏi tin hôm nay, week khi hỏi tin tuần này. Chỉ gọi thêm policy nếu người dùng yêu cầu rõ kiểm tra policy công ty trong cùng câu hỏi. Ưu tiên ý định mới nhất trong hội thoại; không dùng để tìm tweet/X/Twitter."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa chủ đề ngắn gọn, ví dụ AI hoặc robotics; không tự thêm từ news khi topic=news."}
        topic: {type: string, enum: [general, news], default: "general", description: "news cho tin tức/thời sự; general cho tra cứu khác."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "day=hôm nay, week=tuần này, month=tháng này, year=năm nay; giữ mốc thời gian qua các lượt."}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung của URL cụ thể bằng Firecrawl. Dùng khi người dùng đưa đường dẫn bài/trang và muốn đọc hoặc tóm tắt; nếu chưa có URL thì gọi clarify. Không dùng để tìm kiếm web theo chủ đề (dùng lookup)."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL đầy đủ http(s) do người dùng cung cấp hoặc lấy được từ kết quả tìm kiếm; không bịa URL."}
      required: [url]

  - name: format
    description: "Định dạng danh sách nguồn đã thu thập thành bản tin/digest. Dùng sau khi đã có các item từ lookup, fetch, papers hoặc tool khác; không dùng để tự tìm hay xác minh nguồn mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Các nguồn đã có; giữ title, url, source và summary để có trích dẫn."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Kiểu trình bày: brief ngắn, sections theo mục, bullets gạch đầu dòng, thread đánh số, daily_ai_vn bản tin tiếng Việt."}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản tới Telegram, là hành động có tác dụng bên ngoài. Chỉ dùng sau khi người dùng đã xác nhận rõ ràng ở một lượt sau câu hỏi clarify(response_type=yes_no); đặt confirmed=true khi đó. Không gọi để hỏi xác nhận, tóm tắt, hoặc xử lý yêu cầu ngoài phạm vi. UI/CLI còn yêu cầu xác nhận thủ công trước khi gửi thật."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Chỉ true sau xác nhận rõ ràng của người dùng; code UI/CLI kiểm tra thêm trước khi POST."}
      required: [text]

  - name: policy
    description: "Tra các tài liệu policy cục bộ của bài lab khi người dùng hỏi rõ về company policy hoặc quy định nội bộ. Chọn policy_area=source_citation cho câu hỏi về nguồn, citation, fact đã xác minh, hoặc tweet viral có đáng tin không; data_privacy cho dữ liệu riêng tư; external_publishing cho đăng/gửi; ai_research cho nghiên cứu AI; tool_usage cho cách dùng tool. Nếu cùng yêu cầu còn cần tin web hoặc paper, gọi cả hai tool trong cùng lượt. Không gọi policy chỉ vì người dùng muốn tin web; không dùng cho chính sách pháp luật ngoài công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "source_citation cho kiểm chứng nguồn/citation/tweet viral; data_privacy cho dữ liệu cá nhân; external_publishing cho gửi/đăng; ai_research cho nghiên cứu; tool_usage cho sử dụng tool; all khi không rõ nhóm."}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm paper trên arXiv theo chủ đề và trả metadata/abstract. Dùng khi người dùng muốn tìm nghiên cứu khoa học; không dùng cho tin tức web hoặc đọc toàn văn một paper đã biết (dùng paper_text)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Tải PDF của một paper arXiv theo ID hoặc URL arXiv rồi trích văn bản từ các trang đầu. Dùng khi người dùng muốn đọc paper cụ thể; nếu chưa biết paper nào thì dùng papers trước. Không dùng cho URL bài báo web thông thường (dùng fetch)."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: calculator
    description: "Tính số liệu đơn giản đã có trong nguồn nghiên cứu, như tỷ lệ và chênh lệch. Chỉ dùng khi câu hỏi nghiên cứu cần phép tính; không dùng cho bài tập toán độc lập hoặc lập trình."
    parameters:
      type: object
      properties:
        expression: {type: string, description: "Biểu thức số học, ví dụ 1200 * 0.65"}
      required: [expression]
