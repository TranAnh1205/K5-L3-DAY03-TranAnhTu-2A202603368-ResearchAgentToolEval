# starter_v0 — tool declarations.
# This file is part of the step-2 prompt/tool correction loop.
# Keep tool names stable across artifacts/tools.yaml -> tools/__init__.py -> eval files.

tools:
  - name: clarify
    description: "Use this only when required information is missing or the user intent is ambiguous. Ask for the missing handle, URL, or confirmation before taking any action. Do not guess a Twitter handle or URL. Use this for missing_info cases and for any user-confirmation boundary. Not for normal research when the request is already actionable."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Short clarifying question. For handle requests, ask for the account or mention that the handle should be without @; for URL tasks, ask for the exact URL."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "text for freeform answer, yes_no for confirmation, choice for multiple options."}
        options: {type: array, default: [], items: {type: string}, description: "Optional choices when the user must pick from a small set."}
      required: [question]

  - name: timeline
    description: "Use when the user wants recent posts from a specific public account. This is for a single account's timeline, not topic search. Do not use this for broad discussions or trend searches. `screenname` must be a handle without `@`, such as `sama` or `elonmusk`. If the user does not specify an account, ask a clarifying question instead of guessing."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Twitter/X handle without the @ prefix, e.g. `sama`, `elonmusk`."}
        limit: {type: integer, default: 5, description: "Number of posts to fetch. Use the exact count requested by the user when given."}
      required: [screenname]

  - name: social_search
    description: "Use when the user wants posts about a topic or phrase across X/Twitter, not a single account timeline. Use `search_type=Top` for popular/trending discussion and `search_type=Latest` for the newest posts. Do not use this when the request is about a specific account timeline."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Topic or keyword to search, such as `GPT-5`, `AI`, or `OpenAI`. Keep it focused."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "`Top` for popular/trending posts; `Latest` for newest posts."}
        limit: {type: integer, default: 5, description: "Number of results to return."}
      required: [query]

  - name: lookup
    description: "Use for general web research or news discovery. Choose `topic=news` for current events, market, tech, or news-like queries; choose `topic=general` for broader research. `timeframe` should be `day`, `week`, `month`, or `year` when the user references time. Do not use this when the user already gave an exact URL; prefer `fetch` in that case."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Short search query. Keep it specific; for news use a simple topic like `AI` instead of a long verbose phrase."}
        topic: {type: string, enum: [general, news], default: "general", description: "Use `news` for current events and headlines; use `general` for generic web research."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Use the user-relevant time window: `day` for today, `week` for this week, etc."}
        max_results: {type: integer, default: 5, description: "Maximum number of results to return."}
      required: [query]

  - name: fetch
    description: "Use when the user provides an exact URL, or when a web result already contains a specific URL and the user wants that page read or summarized. Never invent a URL. Do not use this for general topic search."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact article or page URL to fetch and summarize."}
      required: [url]

  - name: format
    description: "Use after you already have research results. Convert a list of items into a concise digest or summary. Do not call this as the first step. Use it to create a final answer from fetched items or web/social results."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "List of source items with title, url, source, summary, and optional section metadata."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Format style for the final digest."}
        headline: {type: string, default: "", description: "Optional headline for the digest."}
      required: [items, template]

  - name: send
    description: "Use only to send a message or post after explicit user confirmation. This is a write action and must not happen automatically. `confirmed` must be `true` before calling this tool. If the user has not confirmed, ask a yes/no confirmation using `clarify` instead of sending anything."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Message text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true and only after explicit user confirmation."}
      required: [text]

  - name: policy
    description: "Use for internal-company policy questions. Search internal company policy documents for rules relating to AI research, source citation, data privacy, external publishing, or tool usage. Not for general web research."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Search query for policy guidance."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area to narrow the search; if not sure, use `all`."}
        top_k: {type: integer, default: 3, description: "Number of matching policy passages to return."}
      required: [query]

  - name: papers
    description: "Use to find research papers on arXiv by keyword or topic. Use this for academic paper discovery, not for general web news or tweets. Prefer `sort_by=relevance` unless the user asks for recency."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Academic topic or keyword to search on arXiv."}
        max_results: {type: integer, default: 5, description: "Maximum number of papers to return."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort preference for the results."}
      required: [query]

  - name: paper_text
    description: "Use after a paper URL or arXiv page is known and the user wants the actual text content extracted. Not for web search. Use this only when a paper is already identified."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv URL or paper identifier to fetch text for."}
        max_pages: {type: integer, default: 5, description: "Maximum number of pages to read from the paper PDF."}
        max_chars: {type: integer, default: 8000, description: "Maximum characters to return from extracted text."}
      required: [arxiv_url]

