# starter_v0 — tool declarations.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask clarifying questions to the user or request confirmation before sensitive operations (such as asking confirmation before sending to Telegram, or asking for a missing URL or username)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần làm rõ hoặc câu hỏi xác nhận gửi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời (text, yes_no khi cần xác nhận, hoặc choice)"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Fetch recent tweets from a specific Twitter/X user's timeline. Use when the user asks for tweets of a person. screenname must be their official lowercase handle without spaces or symbols (e.g. 'sama', 'elonmusk', 'zuck')."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản (lowercase Twitter handle without @ or spaces)"}
        limit: {type: integer, default: 5, description: "Số lượng tweet cần lấy (mặc định 5)"}
      required: [screenname]

  - name: social_search
    description: "Search tweets and posts on Twitter/X social media by query keywords. Use ONLY when the user explicitly asks for tweets, social media posts, or discussions on X/Twitter."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm trên mạng xã hội"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp bài viết (Latest hoặc Top)"}
        limit: {type: integer, default: 5, description: "Số lượng bài viết"}
      required: [query]

  - name: lookup
    description: "Search the web and internet for current news, articles, and general information. Use topic='news' for current events and news. Do NOT use for searching tweets."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm cốt lõi ngắn gọn (ví dụ 'AI')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: 'news' cho tin tức báo chí, 'general' cho thông tin chung"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian (day: hôm nay/24h, week: tuần này, month: tháng này, year: năm nay)"}
        max_results: {type: integer, default: 5, description: "Số kết quả tối đa"}
      required: [query]

  - name: fetch
    description: "Read, extract, and scrape text content from a given web URL. Use only when a specific, valid URL is provided."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ URL đầy đủ hợp lệ"}
      required: [url]

  - name: format
    description: "Synthesize and format collected research items into a structured Markdown digest or newsletter."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item nghiên cứu"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Send a formatted report or message to Telegram. Use ONLY when confirmed=true and the user has explicitly confirmed the transmission."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản Markdown cần gửi đi"}
        confirmed: {type: boolean, default: false, description: "Phải là true khi người dùng đã xác nhận đồng ý gửi"}
      required: [text]

  - name: policy
    description: "Tra cứu tài liệu quy định và chính sách nội bộ công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn tìm kiếm chính sách"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục kết quả"}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo nghiên cứu khoa học trên kho lưu trữ arXiv."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa bài báo khoa học"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Tiêu chí sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Trích xuất toàn bộ văn bản nội dung của bài báo khoa học từ arXiv URL."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Địa chỉ arXiv URL"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần đọc"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự văn bản tối đa"}
      required: [arxiv_url]

  - name: calculator
    description: "Safely evaluate mathematical expressions and calculations for research data. Use when numeric computation is needed."
    parameters:
      type: object
      properties:
        expression:
          type: string
          description: "Mathematical expression to evaluate (e.g. '125 * 34' or 'sqrt(256) + 44')."
      required:
        - expression
